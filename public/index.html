<!doctype html>

  <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<body>
  <header class="barra">
    <a class="marca" href="#/facturas">
      <img src="/icons/favicon-48.png" alt="" width="28" height="28">
      Pólizas de caución
    </a>
    <nav id="nav" hidden>
      <a href="#/facturas" data-ruta="facturas">Facturas</a>
      <a href="#/entidades" data-ruta="entidades">Organismos</a>
      <button type="button" id="reporte-cc" class="nav-accion">↑ Reporte CC</button>

      <button type="button" id="instalar" class="nav-instalar" hidden>Instalar app</button>
    </nav>
  </header>

  <main id="app" tabindex="-1">
    <p class="cargando">Cargando…</p>
  </main>

  <dialog id="dialogo-cc" class="dialogo" aria-label="Asignar centro de costo"></dialog>
  <dialog id="dialogo-reporte" class="dialogo" aria-label="Reporte de centros de costo"></dialog>

  <dialog id="ayuda-ios" class="ayuda">
    <h2>Instalar en el iPhone o iPad</h2>
    <p>Desde Safari, tocá el botón <strong>Compartir</strong> (el cuadrado con la flecha hacia arriba) y elegí <strong>Agregar a inicio</strong>. La app queda con su ícono en la pantalla de inicio.</p>
    <button type="button" class="boton" id="cerrar-ayuda">Entendido</button>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="/js/config.js"></script>
  <script type="module" src="/js/app.js"></script>
